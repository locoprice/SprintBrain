<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1B4FD8">
<title>Pricing · Coming soon — SprintBrain</title>
<meta name="description" content="SprintBrain pricing is coming soon. No subscription. Genuine pay per use. Lifetime credit.">
<link rel="canonical" href="https://sprintbrain.com/pricing/">
<link rel="alternate" hreflang="en" href="https://sprintbrain.com/pricing/">
<link rel="alternate" hreflang="es" href="https://sprintbrain.com/es/pricing/">
<link rel="alternate" hreflang="it" href="https://sprintbrain.com/it/pricing/">
<link rel="alternate" hreflang="x-default" href="https://sprintbrain.com/pricing/">
<link rel="icon" type="image/png" sizes="128x128" href="../icon128.png">
<style>
{{SITE_CSS}}
/* Pricing-specific content; shared navigation and footer are generated from home. */
.pricing-page{flex:1}
.pricing-page .hero-eyebrow::before{animation:none}
.pricing-page .pricing-table{width:100%;max-width:760px;margin:var(--space-12) auto 0;border-collapse:collapse;text-align:left}
.pricing-table td{padding:var(--space-6) 0;border-top:1px solid var(--border);font-size:clamp(17px,2vw,20px);line-height:1.6;font-weight:500}
.pricing-table tr:last-child td{border-bottom:1px solid var(--border)}
body.pricing-layout{min-height:100vh;display:flex;flex-direction:column}
.pricing-layout .nav,.pricing-layout>footer{flex:none}
.pricing-layout a:focus-visible,.pricing-layout button:focus-visible{outline:3px solid var(--primary);outline-offset:4px}
.pricing-layout footer a:focus-visible{outline-color:#fff}
.skip-link{position:absolute;left:var(--space-4);top:-80px;padding:var(--space-3) var(--space-4);background:var(--card);color:var(--primary);z-index:70;border-radius:var(--r-btn)}
.skip-link:focus{top:var(--space-3)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:640px){.pricing-page .pricing-table{margin-top:var(--space-8)}.pricing-table td{padding:var(--space-6) 0}}
</style>
</head>
<body class="pricing-layout">
<a class="skip-link" href="#pricing">Skip to content</a>
{{SITE_HEADER}}
<main id="pricing" class="hero pricing-page" tabindex="-1">
  <div class="hero-inner">
  <div class="hero-eyebrow">Pricing</div>
  <h1>Coming soon.</h1>
  <table class="pricing-table">
    <caption class="sr-only">Our pricing principles</caption>
    <tbody>
      <tr><td>No monthly / yearly subscription. No pathetic marketing.</td></tr>
      <tr><td>Only genuine pay per use.</td></tr>
      <tr><td>Lifetime credit.</td></tr>
      <tr><td>Revenue invested in top Developers and Ai coding model</td></tr>
    </tbody>
  </table>
  </div>
</main>
{{SITE_FOOTER}}
{{SITE_CONTACT}}
<script>
{{SITE_JS}}
</script>
</body>
</html>
